name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: ignore
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    name: Lint + unit/integration tests (offline embeddings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX_URL"
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Tool-layer ceiling (no LLM)
        env:
          EMBEDDINGS_BACKEND: hashing
        run: python -m evals.run_ceiling | tee -a "$GITHUB_STEP_SUMMARY"

  retrieval-eval:
    name: Retrieval eval (production MiniLM embeddings) + regression gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMBEDDINGS_BACKEND: minilm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX_URL"
          pip install -r requirements-dev.txt
      - name: Build vector store
        run: python scripts/ingest_all.py
      - name: Retrieval tests against the production index
        run: python -m pytest -q tests/test_retrieval.py
      - name: Retrieval eval (gate - hybrid_v2 recall@3 >= 0.95)
        run: |
          echo '### Retrieval eval (MiniLM)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m evals.run_retrieval_eval --gate | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Tool-layer ceiling (MiniLM)
        run: python -m evals.run_ceiling | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-results-minilm
          path: reports/results/

  docker:
    name: Docker build + test stage + health check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build test stage (runs lint + tests inside the image)
        run: docker build --target test -t energy-analyst:test .
      - name: Build runtime image
        run: docker build -t energy-analyst:latest .
      - name: Container health check
        run: |
          docker run -d --name app -p 8501:8501 energy-analyst:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1
