name: Agent eval (LLM, manual)

# Runs the full end-to-end agent evaluation. Costs money (~$1-3 per variant on
# Claude Haiku 4.5), so it only runs on demand.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   provider=bedrock   : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (+ optional AWS_DEFAULT_REGION)
#   provider=anthropic : ANTHROPIC_API_KEY
# The --judge option uses ANTHROPIC_API_KEY (judge model: claude-opus-5-5).

on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [bedrock, anthropic]
        default: bedrock
      variants:
        description: Space-separated variants
        default: rag_only agent_v1 agent_v2
      question_set:
        type: choice
        options: [main, holdout]
        default: main
      limit:
        description: Max questions (blank = all)
        default: ""
      judge:
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMBEDDINGS_BACKEND: minilm
      LLM_PROVIDER: ${{ inputs.provider }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Build vector store
        run: python scripts/ingest_all.py
      - name: Run agent eval
        run: |
          set -o pipefail
          ARGS="--variants ${{ inputs.variants }} --question-set ${{ inputs.question_set }} --print-failures"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.judge }}" = "true" ]; then ARGS="$ARGS --judge"; fi
          python -m evals.run_agent_eval $ARGS | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrieval eval + ceiling + report figures
        run: |
          python -m evals.run_retrieval_eval
          python -m evals.run_ceiling
          python -m evals.report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-${{ inputs.provider }}
          path: reports/
